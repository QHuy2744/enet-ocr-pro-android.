
name: Build eNet OCR Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'enet-ocr-android-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q enet-ocr-android-source.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: enet-ocr-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enet-ocr-pro-debug
          path: enet-ocr-android/app/build/outputs/apk/debug/app-debug.apk
          
