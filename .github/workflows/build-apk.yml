name: Build eNet OCR Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source ZIP
        run: test -f enet-ocr-pro-ai-upgraded.zip

      - name: Extract Android source
        run: unzip -oq enet-ocr-pro-ai-upgraded.zip -d .

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: enet-ocr-android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eNet-OCR-Pro-AI-APK
          path: enet-ocr-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
