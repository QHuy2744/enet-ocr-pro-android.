
name: Build eNet OCR Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'enet-ocr-android-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -oq enet-ocr-android-source.zip

      - name: Force Java and Kotlin 17
        working-directory: enet-ocr-android
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.aniux.enetocr"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aniux.enetocr"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF

          echo "=== Java/Kotlin target configuration ==="
          grep -A 4 'compileOptions' app/build.gradle.kts
          grep -A 2 'kotlinOptions' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: enet-ocr-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enet-ocr-pro-debug
          path: enet-ocr-android/app/build/outputs/apk/debug/app-debug.apk
          
